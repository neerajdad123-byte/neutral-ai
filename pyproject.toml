[project]
name = "neutral"
version = "0.1.0"
description = "Neutral: prompt-identity middleware plus the evaluation harness that has to justify it"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

